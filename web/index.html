<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UATC</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>UATC</h1>
    <p>Compress and extract files without losing a single byte.</p>
  </header>

  <main>
    <section id="screen-home" class="screen">
      <h2 tabindex="-1">What do you want to do?</h2>
      <p>Select an operation to get started.</p>
      <div class="operation-grid">
        <button id="btn-compress" type="button">Compress</button>
        <button id="btn-extract" type="button">Extract</button>
        <button id="btn-info" type="button">Archive Info</button>
        <button id="btn-verify" type="button">Verify Archive</button>
      </div>
    </section>

    <section id="screen-select" class="screen" hidden>
      <h2 id="select-title" tabindex="-1">Compress</h2>
      <label for="source">Source file or archive path</label>
      <input id="source" type="text" placeholder="Enter a file or archive path" autocomplete="off" >
      <label for="file-picker">Or select a file from your computer</label>
      <input id="file-picker" type="file" >
      <label for="destination">Destination path</label>
      <input id="destination" type="text" placeholder="Enter a file or archive path" autocomplete="off" >
      <details>
        <summary>Advanced</summary>
        <label for="workers">Worker threads</label>
        <input id="workers" type="number" min="1" value="1">
      </details>
      <button id="btn-start" type="button">Start</button>
      <button id="btn-back" type="button">Back</button>
    </section>

    <section id="screen-progress" class="screen" hidden>
      <h2 tabindex="-1">Working</h2>
      <progress id="progress-bar" max="1" value="0"></progress>
      <p id="progress-text" role="status">0%</p>
    </section>

    <section id="screen-result" class="screen" hidden>
      <h2 tabindex="-1">Done</h2>
      <div id="result-body"></div>
      <button id="btn-again" type="button">Start over</button>
    </section>

    <section id="screen-error" class="screen" hidden>
      <h2 tabindex="-1">Something went wrong</h2>
      <p id="error-text" role="alert"></p>
      <button id="btn-error-back" type="button">Start over</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
