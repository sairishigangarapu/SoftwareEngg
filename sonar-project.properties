# SonarQube / SonarCloud configuration for UATC.
#
# The scanner picks this up automatically from the working directory, so
# `sonar-scanner` needs zero command-line arguments. The Jenkinsfile's
# "SonarQube analysis" stage runs it when SONAR_HOST_URL and SONAR_TOKEN
# are set; without credentials the stage skips cleanly.

# Project identity. The version matches UATC_VERSION in
# include/archive/archive_format.hpp.
sonar.projectKey=uatc
sonar.projectName=UATC - Universal Adaptive Transform Compression
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Production code: the compression core, the archive layer, the filesystem
# layer, the HTTP server, the CLI and the web frontend. pcomp is the
# benchmark scaffold (Sampada's module).
sonar.sources=src,include,web,pcomp

# Tests: the 31-suite test tree.
sonar.tests=tests
sonar.test.inclusions=**/*_test.cpp

# Generated and data files that are not hand-written code.
sonar.exclusions=**/build/**,**/pcomp/build/**,**/datasets/**,\
  **/test_data/**,**/*.jsonl,**/*.md,pcomp/scripts/**,pcomp/datasets/**,\
  pcomp/docs/**

# C/C++ analysis needs to know how each translation unit was compiled. The
# Jenkinsfile emits the compilation database with
#   cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
# before the scanner runs. Without it the C/C++ analysis is skipped and the
# scan still covers the JavaScript frontend and the shell/Python scripts.
sonar.cfamily.compile-commands=build/compile_commands.json
